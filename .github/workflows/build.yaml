name: Build OpenWrt

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y
          sudo apt-get install -y bzip2 g++ gawk gcc git glibc-source libncurses-dev make
          
      - name: Run build
        run: |
          git clone --depth 1 https://git.openwrt.org/openwrt/openwrt.git
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat << 'EOF' > .config
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi-r4=y
          CONFIG_DEVEL=y
          CONFIG_TOOLCHAINOPTS=y
          # CONFIG_DROPBEAR_DBCLIENT is not set
          # CONFIG_DROPBEAR_SK_KEYS is not set
          # CONFIG_GDB is not set
          CONFIG_GNUTLS_ALPN=y
          CONFIG_GNUTLS_ANON=y
          CONFIG_GNUTLS_DTLS_SRTP=y
          CONFIG_GNUTLS_HEARTBEAT=y
          CONFIG_GNUTLS_OCSP=y
          CONFIG_GNUTLS_PSK=y
          # CONFIG_KERNEL_CGROUPS is not set
          # CONFIG_KERNEL_DEBUG_INFO is not set
          # CONFIG_KERNEL_ELF_CORE is not set
          CONFIG_OPENSSL_ENGINE=y
          CONFIG_OPENSSL_WITH_ASM=y
          CONFIG_OPENSSL_WITH_CHACHA_POLY1305=y
          CONFIG_OPENSSL_WITH_CMS=y
          CONFIG_OPENSSL_WITH_DEPRECATED=y
          CONFIG_OPENSSL_WITH_ERROR_MESSAGES=y
          CONFIG_OPENSSL_WITH_IDEA=y
          CONFIG_OPENSSL_WITH_MDC2=y
          CONFIG_OPENSSL_WITH_PSK=y
          CONFIG_OPENSSL_WITH_SEED=y
          CONFIG_OPENSSL_WITH_SRP=y
          CONFIG_OPENSSL_WITH_TLS13=y
          CONFIG_OPENSSL_WITH_WHIRLPOOL=y
          # CONFIG_PACKAGE_dnsmasq is not set
          # CONFIG_PACKAGE_eip197-mini-firmware is not set
          # CONFIG_PACKAGE_kmod-crypto-authenc is not set
          # CONFIG_PACKAGE_kmod-crypto-des is not set
          # CONFIG_PACKAGE_kmod-crypto-hw-safexcel is not set
          # CONFIG_PACKAGE_kmod-crypto-md5 is not set
          # CONFIG_PACKAGE_kmod-crypto-sha1 is not set
          # CONFIG_PACKAGE_kmod-crypto-sha256 is not set
          # CONFIG_PACKAGE_kmod-gpio-button-hotplug is not set
          # CONFIG_PACKAGE_kmod-lib-crc-itu-t is not set
          # CONFIG_PACKAGE_kmod-mt7996-firmware is not set
          # CONFIG_PACKAGE_kmod-nls-base is not set
          # CONFIG_PACKAGE_kmod-phy-aquantia is not set
          CONFIG_PACKAGE_kmod-tun=y
          # CONFIG_PACKAGE_kmod-usb-core is not set
          # CONFIG_PACKAGE_kmod-usb3 is not set
          CONFIG_PACKAGE_knot-libs=y
          CONFIG_PACKAGE_knot-libzscanner=y
          CONFIG_PACKAGE_knot-resolver=y
          # CONFIG_PACKAGE_knot-resolver_dnstap is not set
          CONFIG_PACKAGE_libatomic=y
          CONFIG_PACKAGE_libgmp=y
          CONFIG_PACKAGE_libgnutls=y
          CONFIG_PACKAGE_liblua=y
          CONFIG_PACKAGE_libnettle=y
          CONFIG_PACKAGE_libnghttp2=y
          CONFIG_PACKAGE_libopenssl=y
          CONFIG_PACKAGE_libstdcpp=y
          CONFIG_PACKAGE_libuv=y
          CONFIG_PACKAGE_lmdb=y
          CONFIG_PACKAGE_lua=y
          CONFIG_PACKAGE_luajit=y
          CONFIG_PACKAGE_luasec=y
          CONFIG_PACKAGE_luasocket=y
          # CONFIG_PACKAGE_mtd is not set
          CONFIG_PACKAGE_odhcpd=y
          # CONFIG_PACKAGE_odhcpd-ipv6only is not set
          CONFIG_PACKAGE_tailscale=y
          # CONFIG_PACKAGE_uboot-envtools is not set
          # CONFIG_PACKAGE_uci is not set
          CONFIG_PACKAGE_wpad=y
          # CONFIG_PACKAGE_wpad-basic-mbedtls is not set
          CONFIG_TARGET_OPTIMIZATION="-O2 -pipe -mcpu=cortex-a73+crypto+crc -fno-plt"
          CONFIG_TARGET_OPTIONS=y
          CONFIG_USE_GC_SECTIONS=y
          CONFIG_USE_LTO=y
          CONFIG_USE_MKLIBS=y
          CONFIG_WIFI_SCRIPTS_WPS_BUTTON_DISABLED=y
          EOF
          mkdir -p package/kernel/mt76/patches
          curl -SL https://raw.githubusercontent.com/immortalwrt/immortalwrt/refs/heads/master/package/kernel/mt76/patches/100-wifi-mt76-mt7996-Use-tx_power-from-default-fw-if-EEP.patch > package/kernel/mt76/patches/100-wifi-mt76-mt7996-Use-tx_power-from-default-fw-if-EEP.patch
          make defconfig
          make download
          make world

      - name: Create ZIP with all images
        if: success()
        run: |
          cd openwrt/bin/targets/mediatek/filogic
          zip -r openwrt-bpi-r4-images.zip .

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="openwrt-bpi-r4-$(date +'%Y.%m.%d-%H%M')"
          RELEASE_TITLE="$(date +'%Y-%m-%d %H:%M')"
          
          gh release create "$TAG_NAME" \
            openwrt/bin/targets/mediatek/filogic/openwrt-bpi-r4-images.zip \
            --repo ${{ github.repository }} \
            --title "$RELEASE_TITLE" \
            --notes "Automated daily build of OpenWrt for Banana Pi BPi-R4."
