name: Build OpenWrt

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget
          
      - name: Run build
        run: |
          git clone --depth 1 https://git.openwrt.org/openwrt/openwrt.git
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          printf '%s\n' 'CONFIG_TARGET_mediatek=y' 'CONFIG_TARGET_mediatek_filogic=y' 'CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi-r4=y' 'CONFIG_DEVEL=y' '# CONFIG_DROPBEAR_DBCLIENT is not set' '# CONFIG_DROPBEAR_SK_KEYS is not set' '# CONFIG_KERNEL_CGROUPS is not set' '# CONFIG_KERNEL_DEBUG_INFO is not set' '# CONFIG_KERNEL_ELF_CORE is not set' '# CONFIG_PACKAGE_kmod-gpio-button-hotplug is not set' '# CONFIG_PACKAGE_mtd is not set' '# CONFIG_PACKAGE_uci is not set' 'CONFIG_TARGET_OPTIMIZATION="-O2 -pipe -mcpu=cortex-a73"' 'CONFIG_TARGET_OPTIONS=y' 'CONFIG_USE_MKLIBS=y' 'CONFIG_WIFI_SCRIPTS_WPS_BUTTON_DISABLED=y' > .config
          mkdir -p package/kernel/mt76/patches
          curl -SL https://raw.githubusercontent.com/immortalwrt/immortalwrt/refs/heads/master/package/kernel/mt76/patches/100-wifi-mt76-mt7996-Use-tx_power-from-default-fw-if-EEP.patch > package/kernel/mt76/patches/100-wifi-mt76-mt7996-Use-tx_power-from-default-fw-if-EEP.patch
          make defconfig
          make download
          make world

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-bpi-r4-images
          path: |
            openwrt/bin/targets/mediatek/filogic/*.img.gz
            openwrt/bin/targets/mediatek/filogic/*.itb
            openwrt/bin/targets/mediatek/filogic/*.fip
            openwrt/bin/targets/mediatek/filogic/*.bin
